<!doctype html>
<html lang="en" data-project="{{project_key}}" data-mark="{{visual_mark}}" data-display-voice="{{display_voice}}" data-surface="{{surface_character}}" data-motif="{{ambient_motif}}" style="--accent-h:{{accent_h}};--accent-pair-h:{{accent_pair_h}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{brand}}</title>
<meta name="robots" content="noindex">
<meta name="hub-project" content="{{project_key}}">
<meta name="csrf-token" content="{{csrf_token}}">
{{theme_init}}
<style>{{tokens_css}}</style>
<style>{{shell_css}}</style>
<style>{{print_css}}</style>
</head>
<body class="hub-app">
<a class="skip-link" href="#tabPanes">Skip to content</a>

<!-- The living backdrop. Purely presentational and inert (aria-hidden, pointer-events:none, and
     pinned behind everything at z-index -1); hub.js drives its intensity from how many workers
     are actually working, so the page's ambient motion is itself a readout of the fleet. -->
<div class="hub-backdrop" id="hubBackdrop" aria-hidden="true"><span class="grid-veil"></span></div>

<!-- Everything the dialog must shut out lives inside #appShell: openModal sets inert on it, which
     removes the background from BOTH the tab order and the accessibility tree. aria-modal alone
     only asks assistive tech to do that; inert makes it true for keyboard users too. The modal and
     the toast/announcer live outside this wrapper so they stay reachable while it is inert. -->
<div id="appShell">
<nav class="navbar-main">
  <div class="navbar-brand"><span class="brand-mark" id="brandMark" aria-hidden="true"></span> {{brand}}</div>
  <div class="navbar-right">
    <div class="status-pill error" id="statusPill" role="status" aria-live="polite" data-state="disconnected">
      <span class="status-dot" aria-hidden="true"></span><span id="statusText">Disconnected</span><span class="status-meta" id="statusMeta"></span><span class="clock" id="clock" aria-hidden="true"></span>
    </div>
    <a class="btn-white" id="launchWorkerBtn" href="#" data-launch="1" data-count="1" hidden title="Launch one local worker that pulls the next ready task and completes it with a receipt.">▶ Launch Worker</a>
    <a class="btn-white" id="launch4Btn" href="#" data-launch="1" data-count="4" hidden title="Launch four independent workers against the shared readiness queue.">▶▶ Launch 4</a>
    <button class="btn-white" id="paletteBtn" type="button" data-hub-palette-trigger title="Search — Ctrl/Cmd-K" aria-label="Open command palette">⌘K</button>
    <label class="sr-only" for="hub-density-select">Density</label>
    <select id="hub-density-select" class="hub-density-select btn-white" autocomplete="off" aria-label="Information density" title="Information density">
      <option value="comfortable">Comfortable</option><option value="compact">Compact</option>
    </select>
    <label class="sr-only" for="hub-theme-select">Theme</label>
    <select id="hub-theme-select" class="hub-theme-select btn-white" autocomplete="off" aria-label="Theme">
      <option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option>
    </select>
  </div>
</nav>

<div class="page-wrapper">
  <div class="tabs-bar" id="tabsBar" role="tablist" aria-label="Hub views"></div>
  <main id="tabPanes"></main>
</div>
</div><!-- /#appShell -->

<div class="modal-overlay" id="universalModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalSubtitle">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-icon t-info" id="modalIcon" aria-hidden="true"></div>
      <div class="modal-htext"><div class="modal-title" id="modalTitle">Details</div><div class="modal-subtitle" id="modalSubtitle"></div></div>
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="false"></div>
<div class="sr-only" id="liveAnnouncer" aria-live="polite" aria-atomic="true"></div>

<script id="hub-data" type="application/json">{{snapshot_json}}</script>
<script>{{theme_js}}</script>
<script>{{hub_js}}</script>
<script>{{palette_js}}</script>
</body>
</html>
