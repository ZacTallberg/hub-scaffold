# Disposable full verifier. Invoke manually for a release, risky boundary, or occasional audit.
# It uses isolated runtime state and ends when its evidence is reported.
name: verification

on:
  workflow_dispatch:

jobs:
  full-verification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install integration dependencies
        run: pip install -r requirements.txt
      - name: Isolated full verification
        run: bash tools/selftest.sh
