# Fast CI — cheap, high-signal sanity checks for ordinary pushes and pull requests.
#
# Full integration verification is intentionally separate in verify.yml and runs only when invoked.
# Make this fast job required if desired; do not turn every small change into a release ceremony.
name: ci-fast
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fast impact-independent checks
        run: bash tools/check.sh --all-fast
