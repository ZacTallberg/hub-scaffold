{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in{% if app_name %} · {{ app_name }}{% endif %}</title>
  <link rel="stylesheet" href="{% static 'app_gate/gate.css' %}">
</head>
<body class="gate-page">
  <main class="gate-card" aria-labelledby="gate-title">
    <p class="gate-eyebrow">{{ app_name|default:"This app" }}</p>
    <h1 id="gate-title" class="gate-title">Sign in to continue</h1>
    <p class="gate-lede">Access is limited to people on this app's roster.</p>
    {% if error %}<p class="gate-error" role="alert"><span aria-hidden="true">!</span> {{ error }}</p>{% endif %}
    <form method="post" action="{% url 'app_gate:login' %}" class="gate-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label class="gate-label" for="gate-username">Username</label>
      <input class="gate-input" id="gate-username" name="username" autocomplete="username"
             value="{{ username|default:'' }}" required autofocus>
      <label class="gate-label" for="gate-password">Password</label>
      <input class="gate-input" id="gate-password" name="password" type="password"
             autocomplete="current-password" required>
      <button class="gate-button" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
